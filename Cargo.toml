[package]
name = "rust_actix_example"
version = "0.1.0"
authors = ["David DiMaria <info@collectivesessions.com>"]
edition = "2018"

[dependencies]
argon2rs = "0.2.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-key-expansion", "cookie-private"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = "0.15"
diesel = { version = "1.4.0", features = ["chrono", "mysql", "postgres", "sqlite", "r2d2", "uuidv07"] }
dotenv = "0.14"
envy = "0.4"
jsonwebtoken = "7"
lazy_static = "1.4"
listenfd = "0.3"
rayon = "1.0"
r2d2-diesel = "1.0.0"
redis = { version = "1", features = ["connection-manager", "tokio-comp"] }
r2d2 = "0.8"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "0.7", features = ["serde", "v4"] }
validator = "0.8.0"
validator_derive = "0.8.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
cockroach = []
mysql = []
postgres = []
sqlite = []
default = ["mysql"]
